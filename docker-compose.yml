
services:
  postgres:
    image: postgres:17
    container_name: testgenius-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: testgenius
      POSTGRES_USER: testgenius
      POSTGRES_PASSWORD: change-me

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgenius -d testgenius"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
